server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoice_gateway}
    username: ${DB_USERNAME:invoice}
    password: ${DB_PASSWORD:invoice}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: true
ai:
  provider: ${AI_PROVIDER:demo}
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o}
claude:
  api-key: ${CLAUDE_API_KEY:}
  model: ${CLAUDE_MODEL:claude-sonnet-4-6}
invoice:
  storage-dir: ${INVOICE_STORAGE_DIR:./data/invoices}
management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoice_gateway}
    username: ${DB_USERNAME:invoice}
    password: ${DB_PASSWORD:invoice}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

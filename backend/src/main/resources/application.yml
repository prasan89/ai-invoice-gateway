server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoice_gateway}
    username: ${DB_USERNAME:invoice}
    password: ${DB_PASSWORD:invoice}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  flyway:
    enabled: true
ai:
  provider: ${AI_PROVIDER:demo}
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o}
claude:
  api-key: ${CLAUDE_API_KEY:}
  model: ${CLAUDE_MODEL:claude-sonnet-4-6}
hyperspace:
  api-key: ${HYPERSPACE_API_KEY:}
  base-url: ${HYPERSPACE_BASE_URL:http://localhost:6655/anthropic}
  model: ${HYPERSPACE_MODEL:claude-sonnet-4-6}
invoice:
  storage-dir: ${INVOICE_STORAGE_DIR:./data/invoices}
  demo-organization-id: ${INVOICE_DEMO_ORG_ID:bc1e6b1a-8837-3056-b676-6cae794de216}
  arithmetic:
    tolerance: ${INVOICE_ARITH_TOLERANCE:0.05}
    warn-threshold: ${INVOICE_ARITH_WARN_THRESHOLD:0.50}
  email:
    enabled: ${INVOICE_EMAIL_ENABLED:false}
    host: ${INVOICE_EMAIL_HOST:}
    port: ${INVOICE_EMAIL_PORT:993}
    user: ${INVOICE_EMAIL_USER:}
    password: ${INVOICE_EMAIL_PASSWORD:}
    folder: ${INVOICE_EMAIL_FOLDER:INBOX}
    ssl: ${INVOICE_EMAIL_SSL:true}
    poll-interval-ms: ${INVOICE_EMAIL_POLL_INTERVAL_MS:300000}
gstin:
  # Set to "test" to enable the allowlist below for end-to-end auto-approval testing.
  # In production, leave as "production" — only real checksum-valid GSTINs pass.
  validation:
    mode: ${GSTIN_VALIDATION_MODE:production}
  portal:
    # Set to true to call the GST portal sandbox API for legal name + registration status.
    # Results are cached 24h in gstin_verifications. Falls back gracefully when offline.
    enabled: ${GSTIN_PORTAL_ENABLED:false}
  # Comma-separated synthetic GSTINs that bypass checksum in test mode only.
  # GSTINs from sample invoices used in local testing:
  #   33AABCA1234A1ZQ — ABC Technologies (01_intrastate, 02_interstate)
  #   33AABCB4567C1ZK — Bengaluru Retail Systems (02_interstate customer)
  #   33AABCC7890D1ZJ — Chennai Industrial Supplies (03_discount_cess)
  #   33AABCS4321E1ZN — Southline Manufacturing (03_discount_cess customer)
  #   33AABCD1111F1ZX — Delta Office Services (04_low_confidence)
  #   33ASTRA1234A1ZP — Astra Office Systems (auto_approve_clean_unique)
  #   29ORION5678B1ZQ — Orion Business Solutions (auto_approve_clean_unique)
  test-allowlist: ${GSTIN_TEST_ALLOWLIST:33AABCA1234A1ZQ,33AABCB4567C1ZK,33AABCC7890D1ZJ,33AABCS4321E1ZN,33AABCD1111F1ZX,33ASTRA1234A1ZP,29ORION5678B1ZQ,33AAZCA1234A1Z1,33AAZCX5678B1ZF}
management:
  endpoints:
    web:
      exposure:
        include: health,info

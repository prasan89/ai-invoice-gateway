services:
  postgres:
    image: postgres:16
    container_name: ai-invoice-postgres
    environment:
      POSTGRES_DB: invoice_gateway
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
